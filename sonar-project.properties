# Read by the scanner in scripts/security/scan-sonar.sh (local SonarQube only)
# and by the SonarQube CLI to find the project key.
sonar.projectKey=vestigian
sonar.projectName=Vestigian

sonar.sources=app,server,shared,scripts,service-worker,docker
sonar.tests=app,server,shared,scripts,e2e
sonar.test.inclusions=**/__test__/**,e2e/**
sonar.exclusions=**/__test__/**,server/database/migrations/**,**/*.d.ts

# Blame is only needed for "new code" periods; uncommitted files would warn.
sonar.scm.disabled=true

# Per-file exceptions, each for a rule that is wrong about this code rather
# than a finding nobody wanted to fix. Scoped to files, never rule-wide, so
# the same rule still reports everywhere else.
sonar.issue.ignore.multicriteria=statusRegister,statusForgot,statusContribution,statusGeolocate,statusMapCanvas,statusSearch,statusReview,autocompleteSettings,autocompleteStepUp,autocompleteLogin,autocompleteRegister

# Web:S6819 asks for <output> in place of role="status". This project's own
# accessibility lint (vuejs-accessibility/form-control-has-label, part of
# `pnpm check`) counts <output> as a form control and demands a label for it,
# and a status message has nothing to label — so these keep role="status".
sonar.issue.ignore.multicriteria.statusRegister.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusRegister.resourceKey=app/components/auth/RegisterForm.vue
sonar.issue.ignore.multicriteria.statusForgot.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusForgot.resourceKey=app/pages/forgot-password.vue
sonar.issue.ignore.multicriteria.statusContribution.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusContribution.resourceKey=app/components/contribute/ContributionPanel.vue
sonar.issue.ignore.multicriteria.statusGeolocate.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusGeolocate.resourceKey=app/components/map/GeolocateButton.vue
sonar.issue.ignore.multicriteria.statusMapCanvas.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusMapCanvas.resourceKey=app/components/map/MapCanvas.vue
sonar.issue.ignore.multicriteria.statusSearch.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusSearch.resourceKey=app/components/map/MapSearchField.vue
sonar.issue.ignore.multicriteria.statusReview.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusReview.resourceKey=app/components/moderation/ReviewQueue.vue

# Web:S6840 misreads Nuxt UI's <UInput>. A probe scan (2026-09-14) flagged
# <UInput type="text" autocomplete="nickname"> — and the same with `username`
# or `one-time-code` — while the identical attributes on a plain <input>, and
# `type="email"` / `type="password"` on <UInput>, all passed. The tokens are
# valid for a text field; the rule cannot see through the component name.
sonar.issue.ignore.multicriteria.autocompleteSettings.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.autocompleteSettings.resourceKey=app/pages/settings.vue
sonar.issue.ignore.multicriteria.autocompleteStepUp.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.autocompleteStepUp.resourceKey=app/components/admin/AdminStepUpDialog.vue
sonar.issue.ignore.multicriteria.autocompleteLogin.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.autocompleteLogin.resourceKey=app/components/auth/LoginForm.vue
sonar.issue.ignore.multicriteria.autocompleteRegister.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.autocompleteRegister.resourceKey=app/components/auth/RegisterForm.vue
