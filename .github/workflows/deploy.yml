name: build and publish

# Push to `main` only. Testing is deliberately not CI's job here — `pnpm check`
# runs at pre-push, locally, and the hosted minutes are better spent on the one
# thing that cannot be done locally: building and publishing the image.
#
# There used to be a `verify` job in front of this one whose entire body was
# `pnpm install --frozen-lockfile`. It proved only that the lockfile resolves,
# which the image build below re-proves on its own a minute later, so it was
# paying for the same install twice and gating nothing. It ran on
# `pull_request` too, where `publish` is skipped — so a PR started this workflow
# to do an install and then stop. `changeset-check.yml` is what actually runs on
# a pull request.
#
# Deploying is a separate, manual step, not the last step of this workflow.
# Dokploy's dashboard is deliberately kept off the public internet (reachable
# only via SSH tunnel), so its redeploy webhook can't be hit by a GitHub-hosted
# runner — there is no reachable URL to give it. A `curl` to
# `secrets.DOKPLOY_WEBHOOK_URL` used to sit at the end of this workflow and
# failed on exactly that (the URL Dokploy hands out defaults to
# `localhost:3000`, meaningful only inside the tunnel session that generated
# it). Clicking Deploy in Dokploy after a publish lands here is also the
# existing pattern for releases in this repo — `release.yml` requires a
# manual `workflow_dispatch` rather than auto-releasing on every push, for the
# same reason: no ambient action should be able to trigger production on its
# own.
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: read package version
        id: package
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      # github.repository preserves the case the owner/repo were registered
      # with (Phyllon/vestigian), but an image reference must be lowercase —
      # buildx fails the whole job on this before anything is pushed.
      - name: lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}:v${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
