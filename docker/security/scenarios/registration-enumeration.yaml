# The registration endpoint is a deliberate email-enumeration oracle: it answers
# 409 for an address that already exists, traded for a signup form that is not a
# dead end. `register.post.ts` names the ALTCHA challenge and the four-per-hour
# limit as what keeps that from being free. This is what notices someone paying
# the price anyway.
type: leaky
name: vestigia/registration-enumeration
description: 'Repeated registration conflicts from one address'
filter: "evt.Meta.log_type == 'vestigia' && evt.Parsed.audit == 'auth.register' && evt.Parsed.message == 'registration refused: already exists'"
leakspeed: 60s
capacity: 8
groupby: evt.Meta.source_ip
blackhole: 15m
labels:
  service: http
  confidence: 3
  spoofable: 0
  behavior: 'http:enumeration'
  remediation: true
