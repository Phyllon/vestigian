# Sustained rate limiting across policies.
#
# One 429 is the system working. A stream of them from one address across
# several policies is someone probing for what is not limited, and it is the
# cheapest possible signal because the application already computed it.
type: leaky
name: vestigian/rate-limit-abuse
description: 'Sustained rate-limit rejections from one address'
filter: "evt.Meta.log_type == 'vestigian' && evt.Parsed.audit == 'ratelimit.blocked'"
leakspeed: 5s
capacity: 30
groupby: evt.Meta.source_ip
blackhole: 10m
labels:
  service: http
  confidence: 2
  spoofable: 0
  behavior: 'http:dos'
  remediation: true
