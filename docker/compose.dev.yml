name: vestigia-dev

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: vestigia
      POSTGRES_PASSWORD: vestigia
      POSTGRES_DB: vestigia
    command:
      # Tuned for the tile workload: the working set is small enough to sit in
      # memory, so the planner should assume fast random reads.
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vestigia']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save '' --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: vestigia
      MINIO_ROOT_PASSWORD: vestigia-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # MinIO starts with no buckets, so without this every upload fails on
  # NoSuchBucket — including the image mirror, hours into a crawl.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 vestigia vestigia-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/vestigia;
      "

  imgproxy:
    image: darthsim/imgproxy:v3
    environment:
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: vestigia
      AWS_SECRET_ACCESS_KEY: vestigia-dev-secret
      IMGPROXY_MAX_SRC_RESOLUTION: '80'
      IMGPROXY_ENFORCE_WEBP: 'true'
      IMGPROXY_TTL: '2592000'
    ports:
      - '8080:8080'
    depends_on:
      - minio

  # The development inbox. `server/utils/mail.ts` posts to its HTTP API on 8025
  # whenever no Lettermint key is set, so the verification and reset mails can
  # be read as they will actually arrive — a log line cannot show whether the
  # sheet renders. Web interface: http://localhost:8025. Nothing speaks SMTP
  # here; 1025 is published only so an external client can be pointed at it.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # Machine translation for borrowed article text, self-hosted so that reading a
  # site never sends its content to a third party — the same reasoning that
  # keeps the fonts local and imgproxy in-house.
  #
  # LT_LOAD_ONLY is not a nicety. Without it LibreTranslate loads every language
  # pair it can find, which is gigabytes of models and minutes of startup; these
  # five are the Wikipedias the enrichment endpoint reads. The volume keeps the
  # download from happening again on every `stack:up`.
  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: 'en,nl,de,es,it,fr'
      # Without this, models are installed only when the volume is empty, so
      # adding a language to LT_LOAD_ONLY silently does nothing on an existing
      # deployment. The check is quick when nothing has changed.
      LT_UPDATE_MODELS: 'true'
      LT_DISABLE_WEB_UI: 'true'
      LT_THREADS: '2'
    ports:
      - '5050:5000'
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')"
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot downloads the models; nothing is wrong before that finishes.
      start_period: 300s

  # ---------------------------------------------------------------------------
  # Observability, behind a profile so it is opt-in.
  #
  # `pnpm stack:up` is unchanged and still costs six containers; these six only
  # start on `pnpm stack:observability`. The fast development loop is Pino
  # pretty-printing to the terminal, and that stays true — this profile exists
  # to test dashboards, alert rules and traces before they reach production,
  # not to replace reading stdout.
  #
  # Note that `nuxt dev` runs on the host, not in a container, so Alloy's Docker
  # discovery does not see the app's own logs here. Container logs (Postgres,
  # Valkey, LibreTranslate) do arrive, and traces and metrics work fully because
  # the app pushes and Alloy scrapes across the host boundary.
  # ---------------------------------------------------------------------------

  grafana:
    image: grafana/grafana:11.6.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports:
      - '3001:3000'
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, tempo, prometheus]

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    command: -config.file=/etc/loki/loki.yml
    ports:
      - '3100:3100'
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.7.1
    profiles: [observability]
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - '3200:3200'
      - '4318:4318'
      - '4317:4317'
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # Alloy remote-writes rather than Prometheus scraping the app directly,
      # which this flag is what enables.
      - --web.enable-remote-write-receiver
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    environment:
      # Development sends nothing; the receiver exists so the routing tree and
      # the rules can be exercised without a mail provider.
      ALERT_FROM: alerts@localhost
      ALERT_TO: operator@localhost
      MAIL_API_KEY: unset
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  alloy:
    image: grafana/alloy:v1.7.5
    profiles: [observability]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      POSTGRES_DSN: postgresql://vestigia:vestigia@postgres:5432/vestigia?sslmode=disable
      REDIS_ADDR: valkey:6379
      # `nuxt dev` runs on the host, so Alloy reaches it back out through the
      # gateway rather than over the compose network.
      APP_ADDR: host.docker.internal:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '12345:12345'
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki, tempo, prometheus]

  # CrowdSec, behind the same profile as the observability stack — it consumes
  # those logs, so the two belong together. `pnpm stack:observability` starts
  # both; `pnpm stack:up` starts neither.
  #
  # In development the app runs on the host rather than in a container, so the
  # docker acquisition finds nothing to read. Point CrowdSec at a file instead
  # when exercising a scenario locally:
  #   pnpm dev 2>&1 | tee .import/app.log
  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.11
    profiles: [observability]
    environment:
      COLLECTIONS: >-
        crowdsecurity/linux
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
      DISABLE_ONLINE_API: 'true'
    ports:
      - '8085:8080'
    volumes:
      - ./security/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./security/parsers:/etc/crowdsec/parsers/s01-parse/vestigia:ro
      - ./security/scenarios:/etc/crowdsec/scenarios/vestigia:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data

volumes:
  postgres-data:
  minio-data:
  libretranslate-models:
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:
  alloy-data:
  crowdsec-config:
  crowdsec-data:
