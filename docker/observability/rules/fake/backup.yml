# Loki alerting rules for the nightly backup.
#
# Loki's local ruler storage expects <rules_directory>/<tenant>/<file>.yml, and
# with `auth_enabled: false` every write lands in the tenant literally named
# `fake` — Loki's own default, not a placeholder left behind here. Renaming this
# directory to something tidier stops the rules loading.
#
# These alert on log lines rather than metrics because the backup container has
# no scrape endpoint and no reason to grow one. `backup.sh` prints exactly one
# `backup.outcome=` line per stage per run; Alloy already ships every
# container's stdout to Loki, so the lines are there whether or not anyone is
# watching them. These rules are what makes somebody watch.
#
# The "nothing succeeded" rules wrap their count in `or vector(0)`. Without it,
# a job that has stopped logging entirely returns no series, `== 0` on nothing
# is nothing, and the alert cannot fire in exactly the case it exists for
# (found and verified against Loki 3.4.2 on 2026-10-08).
groups:
  - name: backup
    # Hourly. A nightly job does not need a tighter evaluation interval, and a
    # 24-hour lookback re-evaluated every hour means a missed run is caught
    # within the hour rather than at the next midnight.
    interval: 1h
    rules:
      # The failure this whole off-box push exists to prevent is not a backup
      # that errors — it is a backup that stopped running and told nobody. An
      # absence cannot be matched by a log query, so this counts successes and
      # fires when the count is zero.
      - alert: BackupNotRunning
        expr: |
          (sum(count_over_time({service="backup"} |= "backup.outcome=ok stage=dump" [26h])) or vector(0)) == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: No successful database dump in over a day
          description: >
            docker/backup.sh has not logged a successful dump in 26 hours. Either
            the container is down or pg_dump is failing. Until this is fixed the
            atlas has no recoverable state newer than the last good snapshot —
            check `docker compose logs backup`.

      - alert: BackupFailing
        expr: |
          sum(count_over_time({service="backup"} |= "backup.outcome=failed" [24h])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The nightly backup reported a failure
          description: >
            A stage of docker/backup.sh failed in the last 24 hours. The line
            names which one — dump, offsite, prune or check. A dump failure means
            no local copy was kept at all; an offsite failure means the local one
            exists but did not leave this machine.

      # A local dump that never reaches the remote is the silent half-failure:
      # everything looks healthy right up until the VPS is the thing that is
      # lost. Distinct from BackupFailing because it also catches a repository
      # that was configured once and has since been unset.
      - alert: BackupNotLeavingTheMachine
        expr: |
          (sum(count_over_time({service="backup"} |= "backup.outcome=ok stage=offsite" [26h])) or vector(0)) == 0
          and
          sum(count_over_time({service="backup"} |= "backup.outcome=ok stage=dump" [26h])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Backups are being written but not pushed off this VPS
          description: >
            The nightly dump is succeeding locally but no off-box push has
            succeeded in 26 hours — RESTIC_REPOSITORY/RESTIC_PASSWORD may be
            unset, or the Storage Box unreachable. One VPS is one failure domain
            until this clears.

      - alert: BackupRepositoryUnverified
        expr: |
          (sum(count_over_time({service="backup"} |= "backup.outcome=ok stage=check" [9d])) or vector(0)) == 0
          and
          sum(count_over_time({service="backup"} |= "backup.outcome=ok stage=offsite" [9d])) > 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: No successful restic integrity check in over a week
          description: >
            backup.sh runs `restic check` every Sunday; none has passed in nine
            days. Snapshots are still being written, but nothing has confirmed
            they can be read back. Run docker/restore-drill.sh --offsite.

      # The two stores are meant to plateau, not grow: the local volume is pruned
      # with `find -mtime +14` and the remote with `restic forget --keep-daily 14
      # --keep-weekly 8 --prune`. Each run now reports what is actually held
      # (`stage=retention`), and these rules fire when the plateau is not there.
      # They read the *latest* report in the window, so they clear on their own
      # once pruning works again.
      #
      # Fifteen files is the steady state (today's plus fourteen days back); 17
      # allows a missed night and a clock edge without paging anyone.
      - alert: BackupLocalDumpsNotPruned
        expr: |
          max(max_over_time({service="backup"} |= "stage=retention" |= "scope=local" | logfmt | unwrap files [26h])) > 17
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: More local dumps are held than the retention allows
          description: >
            The backup volume on this VPS holds more than 17 dump files; the
            policy keeps about 15 (14 days). The `find -mtime` prune in
            docker/backup.sh is not removing them, so the volume will keep
            growing until the disk fills — look at `docker compose logs backup`
            and at the volume's ownership (the runbook's chown note).

      # 4 GiB is roughly four times what 15 dumps weigh today (about 60 MB each
      # in the restore drill). It is a ceiling for "something is wrong", not a
      # budget: the count rule above catches pruning stopping; this one catches
      # the dump itself ballooning, which the count cannot see.
      - alert: BackupLocalVolumeLarge
        expr: |
          max(max_over_time({service="backup"} |= "stage=retention" |= "scope=local" | logfmt | unwrap bytes [26h])) > 4294967296
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The local backup dumps exceed 4 GiB
          description: >
            The dumps held on this VPS total more than 4 GiB. Either the
            database has grown far past what the restore drill measured or
            something other than a dump is being written to the volume. Check
            `du` on the backup-data volume before the disk-space alert does it
            for you.

      # 14 dailies plus 8 weeklies is at most 22; the margin is for a weekly that
      # does not coincide with a daily being kept for a moment before the prune.
      - alert: BackupRepositoryNotPruned
        expr: |
          max(max_over_time({service="backup"} |= "stage=retention" |= "scope=offsite" | logfmt | unwrap snapshots [26h])) > 26
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The off-box restic repository holds more snapshots than the policy keeps
          description: >
            More than 26 nightly snapshots are in the restic repository; the
            policy is 14 daily and 8 weekly. `restic forget --prune` is either
            failing (see BackupFailing) or the retention flags changed. The
            Storage Space fills slowly, then all at once.
