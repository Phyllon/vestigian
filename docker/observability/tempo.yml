# Tempo, monolithic, on local disk.
#
# The documentation cautions against the `local` backend for production, but the
# reason it gives is that a distributed deployment needs every component to see
# the same disk. Single-binary on one box is exactly the case where that does
# not apply.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    # Tempo speaks OTLP natively, so the app exports straight here with no
    # collector in between. Alloy still forwards traces it receives, but this
    # keeps a direct path available.
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Seven days. Traces answer "why was this one request slow", which is a
    # question asked within hours, not weeks.
    block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
