name: vestigian

# Container logs are rotated. Without this the json-file driver grows without
# bound, which was already true before any of this and becomes considerably more
# true now that the app writes a structured line per request.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-vestigian/vestigian}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgres://vestigian:${POSTGRES_PASSWORD}@postgres:5432/vestigian
      NUXT_REDIS_URL: redis://valkey:6379
      # Traefik terminates TLS in front of this container and Bunny sets
      # x-real-ip in front of that, so the header can be believed here.
      #
      # This is only true while the Hetzner firewall refuses everything that is
      # not a Bunny edge address. Without that rule anything reaching Traefik
      # directly can forge x-real-ip per request and every limit in
      # RATE_LIMITS becomes decorative — see server/utils/ratelimit.ts.
      NUXT_BEHIND_TRUSTED_PROXY: 'true'
      NUXT_ALTCHA_SECRET: ${ALTCHA_SECRET}
      # Traces go to Alloy, which batches and forwards to Tempo. An empty value
      # disables tracing outright — the collector is optional infrastructure and
      # the app must serve without it, exactly as it does without LibreTranslate.
      NUXT_TELEMETRY_OTLP_ENDPOINT: http://alloy:4318
      NUXT_TELEMETRY_LOG_LEVEL: ${LOG_LEVEL:-info}
      # Service name, not a public host: the app reaches the translator
      # over the compose network and nothing else can.
      NUXT_TRANSLATE_URL: http://libretranslate:5000/translate
      NUXT_TRANSLATE_TARGET: en
      NUXT_SESSION_PASSWORD: ${SESSION_PASSWORD}
      NUXT_PUBLIC_SITE_URL: ${SITE_URL}
      NUXT_PUBLIC_IMAGE_BASE_URL: ${IMAGE_BASE_URL}
      NUXT_PUBLIC_BASEMAP_PROVIDER: pmtiles
      NUXT_PUBLIC_BASEMAP_PMTILES_URL: ${PMTILES_URL}
      NUXT_IMGPROXY_BASE_URL: ${IMAGE_BASE_URL}
      NUXT_IMGPROXY_KEY: ${IMGPROXY_KEY}
      NUXT_IMGPROXY_SALT: ${IMGPROXY_SALT}
      NUXT_STORAGE_ENDPOINT: ${BUNNY_S3_ENDPOINT}
      NUXT_STORAGE_BUCKET: ${BUNNY_BUCKET}
      NUXT_STORAGE_ACCESS_KEY_ID: ${BUNNY_ACCESS_KEY_ID}
      NUXT_STORAGE_SECRET_ACCESS_KEY: ${BUNNY_SECRET_ACCESS_KEY}
      NUXT_MAIL_API_KEY: ${MAIL_API_KEY}
      # The envelope sender has to be an address on a domain verified with
      # Lettermint, or every message is refused at the API rather than bounced.
      NUXT_MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      # libretranslate is deliberately absent. It takes minutes to download its
      # models on a cold volume, and translation fails open — holding every
      # deploy behind an optional nicety would be the wrong trade.
    labels:
      traefik.enable: 'true'
      traefik.http.routers.vestigian.rule: Host(`${SITE_HOST}`)
      traefik.http.routers.vestigian.entrypoints: websecure
      traefik.http.routers.vestigian.tls.certresolver: letsencrypt
      traefik.http.routers.vestigian.middlewares: app-rate-limit@file
      # A second, more specific router so the metrics endpoint can carry its own
      # middleware — Traefik attaches middleware per router, not per path. The
      # higher priority is what makes it win over the catch-all above.
      traefik.http.routers.vestigian-metrics.rule: Host(`${SITE_HOST}`) && Path(`/api/metrics`)
      traefik.http.routers.vestigian-metrics.priority: '100'
      traefik.http.routers.vestigian-metrics.entrypoints: websecure
      traefik.http.routers.vestigian-metrics.tls.certresolver: letsencrypt
      traefik.http.routers.vestigian-metrics.middlewares: deny-external@file
      traefik.http.routers.vestigian-metrics.service: vestigian
      traefik.http.services.vestigian.loadbalancer.server.port: '3000'
      traefik.http.services.vestigian.loadbalancer.healthcheck.path: /api/ready
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: vestigian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vestigian
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vestigian']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *default-logging
    # Tiles are regenerable, so persistence buys nothing and costs disk I/O.
    command: valkey-server --save '' --appendonly no --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data

  imgproxy:
    image: darthsim/imgproxy:v3
    restart: unless-stopped
    logging: *default-logging
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: ${BUNNY_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${BUNNY_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BUNNY_SECRET_ACCESS_KEY}
      IMGPROXY_TTL: '2592000'
      IMGPROXY_ENFORCE_WEBP: 'true'
    labels:
      traefik.enable: 'true'
      traefik.http.routers.images.rule: Host(`${IMAGE_HOST}`)
      traefik.http.routers.images.entrypoints: websecure
      traefik.http.routers.images.tls.certresolver: letsencrypt
      traefik.http.services.images.loadbalancer.server.port: '8080'

  # Deliberately has no Traefik labels: this is reachable only from inside the
  # compose network, by the app. Nothing about a site's text should leave the
  # box to be translated, which is the whole reason for self-hosting it.
  #
  # LT_LOAD_ONLY confines it to the Wikipedias the enrichment endpoint reads.
  # Without it, every available model is loaded — gigabytes, and minutes of
  # startup on a one-VPS deployment that cannot spare either.
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    # gunicorn's own entrypoint runs it with `--max-requests 250`; recycling a
    # worker at that ceiling is supposed to spawn a replacement immediately,
    # but the arbiter has been observed in dev not to, leaving it listening
    # with zero workers while `restart: unless-stopped` above does nothing
    # because the container never actually exits. `init: true` (tini as PID 1)
    # is still worth having but did not fix this when tried — see the fuller
    # account, and the actual mitigation (`autoheal`), in docker/compose.dev.yml.
    # Lower-risk here than in dev: enrichment translation is one request at a
    # time from real traffic, not the rapid burst `pnpm i18n:translate` sends,
    # and it fails open regardless (see CLAUDE.md's Enrichment section) — but
    # `autoheal` costs nothing and keeps both compose files honest with each
    # other.
    init: true
    labels:
      autoheal: 'true'
    logging: *default-logging
    environment:
      LT_LOAD_ONLY: 'en,nl,de,es,it,fr'
      # Without this, models are installed only when the volume is empty, so
      # adding a language to LT_LOAD_ONLY silently does nothing on an existing
      # deployment. The check is quick when nothing has changed.
      LT_UPDATE_MODELS: 'true'
      LT_DISABLE_WEB_UI: 'true'
      LT_THREADS: '2'
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backup-data:/backups
    entrypoint: ['/bin/sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Observability. Roughly 1.6 GB of the box's 16 GB, all on local disk.
  #
  # Every one of these carries a memory limit, which the services above mostly
  # do not. That asymmetry is deliberate: a single unbounded LogQL or PromQL
  # query is capable of taking memory away from Postgres, and a monitoring stack
  # that causes the outage it was installed to observe is worse than none.
  #
  # Grafana has no Traefik labels and binds to loopback. It holds request logs,
  # which contain visitor IP addresses, and moderation activity — reachable over
  # an SSH tunnel and from nowhere else:
  #
  #   ssh -L 3001:localhost:3001 <vps>
  # ---------------------------------------------------------------------------

  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      # Loopback only. Not `3001:3000`, which would publish it to the internet
      # through the host firewall regardless of Traefik.
      - '127.0.0.1:3001:3000'
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, tempo, prometheus]
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      ALERT_FROM: ${ALERT_FROM}
      ALERT_TO: ${ALERT_TO}
      # Lettermint over SMTP, reusing the key the app already holds rather than
      # standing up a second mail path.
      MAIL_API_KEY: ${MAIL_API_KEY}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.7.5
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      POSTGRES_DSN: postgresql://vestigian:${POSTGRES_PASSWORD}@postgres:5432/vestigian?sslmode=disable
      REDIS_ADDR: valkey:6379
      APP_ADDR: app:3000
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # Read-only. Alloy needs the socket to discover containers and read their
      # logs; it never writes through it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki, tempo, prometheus]
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # CrowdSec: detection from logs, plus AppSec for the WAF rules.
  #
  # One engine under ~150 MB covering both slots. It reads the application's own
  # structured logs — which carry the matched route and the `audit` vocabulary,
  # not just a status code — and writes decisions that a bouncer enforces.
  #
  # **Detection is not enforcement.** A decision here does nothing until a
  # bouncer reads it. The right place for this deployment is the CDN edge, so
  # blocked traffic never reaches the box at all; see docker/security/README.md.
  # ---------------------------------------------------------------------------

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.11
    restart: unless-stopped
    environment:
      # AppSec is what makes this cover the WAF category: virtual patching for
      # known CVEs, plus generic SQLi and XSS rules.
      COLLECTIONS: >-
        crowdsecurity/linux
        crowdsecurity/traefik
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_traefik: ${CROWDSEC_BOUNCER_KEY}
      # Community blocklist. Sharing signals is the point of the project; opting
      # out still leaves local detection working.
      #
      # GDPR-relevant: this shares the IP addresses CrowdSec locally flags as
      # abusive with CrowdSec's central API, on the legitimate-interest basis
      # of Art. 6(1)(f) (network and information security). It is the one
      # outbound flow of visitor-derived data this project's own GDPR section
      # in CLAUDE.md and the privacy policy both have to name explicitly —
      # setting this to 'true' removes it, at the cost of losing the community
      # blocklist.
      DISABLE_ONLINE_API: 'false'
    volumes:
      - ./security/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./security/parsers:/etc/crowdsec/parsers/s01-parse/vestigian:ro
      - ./security/scenarios:/etc/crowdsec/scenarios/vestigian:ro
      # Read-only: CrowdSec discovers containers and reads their logs through
      # the socket, exactly as Alloy does. It never writes through it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

volumes:
  postgres-data:
  valkey-data:
  backup-data:
  libretranslate-models:
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:
  alertmanager-data:
  alloy-data:
  crowdsec-config:
  crowdsec-data:
