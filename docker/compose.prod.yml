name: vestigian

# Container logs are rotated. Without this the json-file driver grows without
# bound, which was already true before any of this and becomes considerably more
# true now that the app writes a structured line per request.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # ---------------------------------------------------------------------------
  # Schema migrations, once per deploy, before the app starts.
  #
  # The app image carries `.output/migrate.mjs` (drizzle's migrator bundled into one
  # file, see the Dockerfile) and the SQL under `server/database/migrations`. It
  # applies whatever the journal lists that `drizzle.__drizzle_migrations` does not
  # already hold, then exits. `app` waits for it to exit 0: a migration that fails
  # leaves the old container serving rather than a new one without its tables.
  #
  # A release that adds a table used to need the SQL applied by hand (runbook §14a);
  # this replaces that. Migrations must stay additive and backwards-compatible, since
  # the old app keeps running against the new schema for the seconds in between.
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-vestigian/vestigian}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: 'no'
    command: ['node', '.output/migrate.mjs']
    environment:
      NUXT_DATABASE_URL: postgres://vestigian:${POSTGRES_PASSWORD}@postgres:5432/vestigian
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-vestigian/vestigian}:${IMAGE_TAG:-latest}
    # Dokploy's own deploy command is `up -d --build --remove-orphans` — no
    # `--pull` flag, and `--build` only rebuilds services with a `build:`
    # directive (bunny-bouncer, backup below), never causing this image-only
    # service to re-check the registry. Since the tag is the mutable `latest`,
    # once it was pulled once it stayed cached forever: every deploy recreated
    # this container from that same frozen image regardless of new pushes,
    # invisibly, until a change to the app's own code (not just this compose
    # file, which Dokploy does re-clone fresh from git every time) needed a
    # fresh image to take effect and didn't get one. `pull_policy: always`
    # makes Compose re-check the registry on every `up`, with or without a
    # `--pull` flag on the command Dokploy actually runs.
    pull_policy: always
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgres://vestigian:${POSTGRES_PASSWORD}@postgres:5432/vestigian
      NUXT_REDIS_URL: redis://valkey:6379
      # Traefik terminates TLS in front of this container and Bunny sets
      # x-real-ip in front of that, so the header can be believed here.
      #
      # This is only true while nothing but Bunny can reach the app. Here that
      # is enforced by the router rules below, which only match requests carrying
      # the secret `X-Origin-Key` header that a Bunny Edge Rule adds to every
      # request it forwards (no allowlist of Bunny's addresses to keep current).
      # Anything reaching Traefik directly has no such header, matches no router
      # and gets a 404, so it cannot forge x-real-ip against the app — see
      # server/utils/ratelimit.ts for why that matters.
      NUXT_BEHIND_TRUSTED_PROXY: 'true'
      NUXT_ALTCHA_SECRET: ${ALTCHA_SECRET}
      # Traces go to Alloy, which batches and forwards to Tempo. An empty value
      # disables tracing outright — the collector is optional infrastructure and
      # the app must serve without it, exactly as it does without LibreTranslate.
      NUXT_TELEMETRY_OTLP_ENDPOINT: http://alloy:4318
      NUXT_TELEMETRY_LOG_LEVEL: ${LOG_LEVEL:-info}
      # Service name, not a public host: the app reaches the translator
      # over the compose network and nothing else can.
      NUXT_TRANSLATE_URL: http://libretranslate:5000/translate
      NUXT_TRANSLATE_TARGET: en
      NUXT_SESSION_PASSWORD: ${SESSION_PASSWORD}
      NUXT_PUBLIC_SITE_URL: ${SITE_URL}
      # nuxt.config.ts's `security.corsHandler.origin` can only default to
      # 'http://localhost:3000' at build time (the image is built once, with
      # no per-deployment build args) — this is what actually sets the allowed
      # CORS origin in production, applied at container start. See the comment
      # on corsHandler in nuxt.config.ts for why the build-time value was
      # silently never taking effect here.
      NUXT_SECURITY_CORS_HANDLER_ORIGIN: ${SITE_URL}
      NUXT_PUBLIC_IMAGE_BASE_URL: ${IMAGE_BASE_URL}
      NUXT_PUBLIC_BASEMAP_PROVIDER: pmtiles
      NUXT_PUBLIC_BASEMAP_PMTILES_URL: ${PMTILES_URL}
      # Hillshade under the Barrington sheet: the URL of the Mapterhorn mirror on our
      # own CDN (runbook §15a). Empty means no relief is drawn — deliberately: the
      # public fallback host is Cloudflare, which a production build must not reach.
      NUXT_PUBLIC_BASEMAP_TERRAIN_URL: ${TERRAIN_URL:-}
      # The DARE and satellite rasters, mirrored per-tile into the storage zone and
      # served through the maps pull zone (runbook §15b), as `…/{z}/{x}/{y}.png|jpg`
      # templates. Empty means the browser falls back to the upstream servers
      # (dh.gu.se, tiles.maps.eox.at) — a visitor's IP reaching a third party.
      NUXT_PUBLIC_BASEMAP_ANTIQUITY_DARE_URL: ${DARE_TILES_URL:-}
      NUXT_PUBLIC_BASEMAP_SATELLITE_URL: ${SATELLITE_TILES_URL:-}
      # On: the data's compiler, René Voorburg, confirmed reuse — see the note on
      # tabulaPeutingerianaEnabled in nuxt.config.ts. Set TABULA_PEUTINGERIANA_ENABLED=false
      # in Dokploy to take the overlay down (redeploy to apply). Dokploy's
      # "Environment" tab only fills `${...}` substitutions actually referenced
      # in this file, which is why the line has to exist at all.
      NUXT_PUBLIC_TABULA_PEUTINGERIANA_ENABLED: ${TABULA_PEUTINGERIANA_ENABLED:-true}
      NUXT_IMGPROXY_BASE_URL: ${IMAGE_BASE_URL}
      NUXT_IMGPROXY_KEY: ${IMGPROXY_KEY}
      NUXT_IMGPROXY_SALT: ${IMGPROXY_SALT}
      NUXT_STORAGE_ENDPOINT: ${BUNNY_S3_ENDPOINT}
      NUXT_STORAGE_BUCKET: ${BUNNY_BUCKET}
      NUXT_STORAGE_ACCESS_KEY_ID: ${BUNNY_ACCESS_KEY_ID}
      NUXT_STORAGE_SECRET_ACCESS_KEY: ${BUNNY_SECRET_ACCESS_KEY}
      NUXT_MAIL_API_KEY: ${MAIL_API_KEY}
      # The envelope sender has to be an address on a domain verified with
      # Brevo, or every message is refused at the API rather than bounced.
      NUXT_MAIL_FROM: ${MAIL_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      # libretranslate is deliberately absent. It takes minutes to download its
      # models on a cold volume, and translation fails open — holding every
      # deploy behind an optional nicety would be the wrong trade.
    labels:
      traefik.enable: 'true'
      # `Header(...)` is the origin lock: only requests Bunny forwarded carry the
      # secret. `:?` makes Compose refuse to start if ORIGIN_KEY is missing —
      # an empty value would make the rule invalid and silently drop the router.
      traefik.http.routers.vestigian.rule: Host(`${SITE_HOST}`) && Header(`X-Origin-Key`, `${ORIGIN_KEY:?set ORIGIN_KEY in the environment}`)
      # Explicit, because Traefik defaults a router's priority to the length of
      # its rule, and the header clause makes this rule longer than the metrics
      # router's fixed 100 below — which would silently make this one win.
      traefik.http.routers.vestigian.priority: '10'
      traefik.http.routers.vestigian.entrypoints: websecure
      traefik.http.routers.vestigian.tls.certresolver: letsencrypt
      traefik.http.routers.vestigian.middlewares: app-rate-limit@file
      # A second, more specific router so the metrics endpoint can carry its own
      # middleware — Traefik attaches middleware per router, not per path. The
      # higher priority is what makes it win over the catch-all above.
      traefik.http.routers.vestigian-metrics.rule: Host(`${SITE_HOST}`) && Path(`/api/metrics`) && Header(`X-Origin-Key`, `${ORIGIN_KEY:?set ORIGIN_KEY in the environment}`)
      traefik.http.routers.vestigian-metrics.priority: '100'
      traefik.http.routers.vestigian-metrics.entrypoints: websecure
      traefik.http.routers.vestigian-metrics.tls.certresolver: letsencrypt
      traefik.http.routers.vestigian-metrics.middlewares: deny-external@file
      traefik.http.routers.vestigian-metrics.service: vestigian
      traefik.http.services.vestigian.loadbalancer.server.port: '3000'
      traefik.http.services.vestigian.loadbalancer.healthcheck.path: /api/ready
    # Dokploy's Traefik runs on its own separate network (`dokploy-network`) from
    # this compose project's implicit default one. Without joining it too,
    # Traefik discovers this service's labels fine (that's a Docker API read,
    # not a network path) but has no way to actually reach the container for
    # its health check or real traffic — surfaces as a healthy container behind
    # a Traefik router permanently returning 503 "no available server".
    networks:
      - default
      - dokploy-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: vestigian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vestigian
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vestigian']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *default-logging
    # Tiles are regenerable, so persistence buys nothing and costs disk I/O.
    command: valkey-server --save '' --appendonly no --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data

  imgproxy:
    image: darthsim/imgproxy:v3
    restart: unless-stopped
    logging: *default-logging
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: ${BUNNY_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${BUNNY_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BUNNY_SECRET_ACCESS_KEY}
      IMGPROXY_TTL: '2592000'
      IMGPROXY_ENFORCE_WEBP: 'true'
    labels:
      traefik.enable: 'true'
      traefik.http.routers.images.rule: Host(`${IMAGE_HOST}`)
      traefik.http.routers.images.entrypoints: websecure
      traefik.http.routers.images.tls.certresolver: letsencrypt
      traefik.http.services.images.loadbalancer.server.port: '8080'
    networks:
      - default
      - dokploy-network

  # Deliberately has no Traefik labels: this is reachable only from inside the
  # compose network, by the app. Nothing about a site's text should leave the
  # box to be translated, which is the whole reason for self-hosting it.
  #
  # LT_LOAD_ONLY confines it to the Wikipedias the enrichment endpoint reads.
  # Without it, every available model is loaded — gigabytes, and minutes of
  # startup on a one-VPS deployment that cannot spare either.
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    # gunicorn's own entrypoint runs it with `--max-requests 250`; recycling a
    # worker at that ceiling is supposed to spawn a replacement immediately,
    # but the arbiter has been observed in dev not to, leaving it listening
    # with zero workers while `restart: unless-stopped` above does nothing
    # because the container never actually exits. `init: true` (tini as PID 1)
    # is still worth having but did not fix this when tried — see the fuller
    # account, and the actual mitigation (`autoheal`), in docker/compose.dev.yml.
    # Lower-risk here than in dev: enrichment translation is one request at a
    # time from real traffic, not the rapid burst `pnpm i18n:translate` sends,
    # and it fails open regardless (see CLAUDE.md's Enrichment section) — but
    # `autoheal` costs nothing and keeps both compose files honest with each
    # other.
    init: true
    labels:
      autoheal: 'true'
    logging: *default-logging
    environment:
      LT_LOAD_ONLY: 'en,nl,de,es,it,fr'
      # Without this, models are installed only when the volume is empty, so
      # adding a language to LT_LOAD_ONLY silently does nothing on an existing
      # deployment. The check is quick when nothing has changed.
      LT_UPDATE_MODELS: 'true'
      LT_DISABLE_WEB_UI: 'true'
      LT_THREADS: '2'
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Nightly dump, kept locally and pushed off this machine. The image adds
  # restic to the stock postgres one — see docker/backup/Dockerfile for why it
  # is built rather than `apk add`-ed at start.
  #
  # ON AN INSTANCE THAT RAN THE OLD ROOT IMAGE, chown the existing volume once
  # before deploying this, or the first dump fails on a permission error:
  #
  #   docker run --rm -v vestigian_backup-data:/b alpine chown -R 70:70 /b
  #
  # Docker seeds ownership into a *fresh* named volume from the image and never
  # revisits it, so a volume created under the previous root-running image stays
  # root-owned no matter what this image says.
  #
  # Everything RESTIC_* is optional: without them the service behaves exactly as
  # it did before, writing local dumps and saying once per run that no remote is
  # configured. With them, losing this VPS stops being the same as losing the
  # atlas. Prove it with docker/restore-drill.sh --offsite, not by reading this.
  backup:
    build: ./backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # `/offsite/restic` — a directory on netcup Storage Space, mounted over NFS on
      # the host and bind-mounted below. The repository is encrypted client-side,
      # so the storage never holds a readable copy.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      # Losing this loses every off-box snapshot: restic encrypts client-side
      # and there is no recovery path. Keep it somewhere that is not this box.
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backup-data:/backups
      # The host directory where netcup Storage Space is mounted (runbook §20),
      # e.g. /mnt/netcup-backup. Unset, it falls back to an empty directory next to
      # this file, which the marker-file check in backup.sh then refuses to treat
      # as an off-box target — so a missing mount reads as a failure, never as a
      # backup written to this disk.
      - ${RESTIC_OFFSITE_DIR:-./offsite-unconfigured}:/offsite
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Observability. Roughly 1.6 GB of the box's 16 GB, all on local disk.
  #
  # Every one of these carries a memory limit, which the services above mostly
  # do not. That asymmetry is deliberate: a single unbounded LogQL or PromQL
  # query is capable of taking memory away from Postgres, and a monitoring stack
  # that causes the outage it was installed to observe is worse than none.
  #
  # Grafana has no Traefik labels and binds to loopback. It holds request logs,
  # which contain visitor IP addresses, and moderation activity — reachable over
  # an SSH tunnel and from nowhere else:
  #
  #   ssh -L 3001:localhost:3001 <vps>
  # ---------------------------------------------------------------------------

  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      # Loopback only. Not `3001:3000`, which would publish it to the internet
      # through the host firewall regardless of Traefik.
      - '127.0.0.1:3001:3000'
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, tempo, prometheus]
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      # Alerting rules evaluated against log lines rather than metrics — the
      # backup container has no scrape endpoint. The `fake/` level inside is
      # Loki's own tenant name when auth_enabled is false, not a placeholder.
      - ./observability/rules:/etc/loki/rules:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    # No `environment:` block: Alertmanager's config parser does not read
    # process environment variables at all (see the long comment at the top of
    # alertmanager.yml), so nothing set here would ever have reached the
    # config anyway — the only value that actually needs to cross from this
    # deploy's secrets into that container is the Discord webhook URL, which
    # arrives as a file instead, below.
    secrets:
      - discord_webhook_url
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.7.5
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # Alloy reports which components are enabled to Grafana Labs (US) unless told
      # not to. Nothing about a visitor is in it, but "nothing leaves the EU" is a
      # claim the About page makes, so it is off rather than argued about.
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      POSTGRES_DSN: postgresql://vestigian:${POSTGRES_PASSWORD}@postgres:5432/vestigian?sslmode=disable
      REDIS_ADDR: valkey:6379
      APP_ADDR: app:3000
      CROWDSEC_ADDR: crowdsec:6060
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # Read-only. Alloy needs the socket to discover containers and read their
      # logs; it never writes through it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki, tempo, prometheus]
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # CrowdSec: detection from logs, plus AppSec for the WAF rules.
  #
  # One engine under ~150 MB covering both slots. It reads the application's own
  # structured logs — which carry the matched route and the `audit` vocabulary,
  # not just a status code — and writes decisions that a bouncer enforces.
  #
  # **Detection is not enforcement.** A decision here does nothing until a
  # bouncer reads it. The right place for this deployment is the CDN edge, so
  # blocked traffic never reaches the box at all; see docker/security/README.md.
  # ---------------------------------------------------------------------------

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.11
    restart: unless-stopped
    environment:
      # AppSec is what makes this cover the WAF category: virtual patching for
      # known CVEs, plus generic SQLi and XSS rules.
      COLLECTIONS: >-
        crowdsecurity/linux
        crowdsecurity/traefik
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_traefik: ${CROWDSEC_BOUNCER_KEY}
      # A second, independently revocable key for the Bunny-edge bouncer below.
      # Separate from the Traefik key on purpose: the Traefik plugin route was
      # evaluated and shelved (see docker/security/README.md) because it needs
      # Traefik's *static* config, which Dokploy owns outside this repo, and
      # because it can only block after the TLS handshake — the Bunny bouncer
      # blocks before the request reaches this box at all. Rotating one key
      # must not require touching the other.
      BOUNCER_KEY_bunny: ${CROWDSEC_BUNNY_BOUNCER_KEY}
      # Community blocklist. Sharing signals is the point of the project; opting
      # out still leaves local detection working.
      #
      # GDPR-relevant: this shares the IP addresses CrowdSec locally flags as
      # abusive with CrowdSec's central API, on the legitimate-interest basis
      # of Art. 6(1)(f) (network and information security). It is the one
      # outbound flow of visitor-derived data this project's own GDPR section
      # in CLAUDE.md and the privacy policy both have to name explicitly —
      # setting this to 'true' removes it, at the cost of losing the community
      # blocklist.
      DISABLE_ONLINE_API: 'false'
    volumes:
      - ./security/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./security/parsers:/etc/crowdsec/parsers/s01-parse/vestigian:ro
      - ./security/scenarios:/etc/crowdsec/scenarios/vestigian:ro
      # Ban lengths per scenario, escalating for repeat offenders. Without it
      # every ban is CrowdSec's packaged 4h. See the file for the reasoning.
      - ./security/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      # Read-only: CrowdSec discovers containers and reads their logs through
      # the socket, exactly as Alloy does. It never writes through it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *default-logging

  # The enforcement half. Polls CrowdSec's own decision stream and mirrors the
  # current ban list onto the pull zone's blocked-IP list, so abusive IPs are
  # blocked at the CDN edge rather than reaching Traefik at all. See
  # docker/security/bunny-bouncer/bouncer.mjs for the reasoning and the list of
  # what is still unproven against the live API — confirm it actually blocks
  # with the bouncer step in documents/runbook_prod.deployment.md §19 before
  # trusting it. BUNNY_PRUNE_UNKNOWN defaults to true: the pull zone's
  # blocked-IP list belongs to this bouncer, so anything CrowdSec does not ban
  # is removed (explained in bouncer.mjs). Set false if the list is edited by hand.
  bunny-bouncer:
    build: ./security/bunny-bouncer
    restart: unless-stopped
    depends_on:
      - crowdsec
    environment:
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BUNNY_BOUNCER_KEY}
      BUNNY_API_KEY: ${BUNNY_API_KEY}
      # The pull zone in front of SITE_HOST specifically — not the images pull
      # zone, which would only block image requests and leave everything else
      # open.
      BUNNY_PULL_ZONE_ID: ${BUNNY_SITE_PULL_ZONE_ID}
      BUNNY_PRUNE_UNKNOWN: ${BUNNY_PRUNE_UNKNOWN:-true}
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *default-logging

# Compose-only (not supported under `docker stack deploy`, which this project
# does not use): mounts the environment variable's value as a file at
# /run/secrets/<name>, rather than writing the secret into alertmanager.yml or
# a process environment Alertmanager never reads anyway.
secrets:
  discord_webhook_url:
    environment: DISCORD_WEBHOOK_URL

volumes:
  postgres-data:
  valkey-data:
  backup-data:
  libretranslate-models:
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:
  alertmanager-data:
  alloy-data:
  crowdsec-config:
  crowdsec-data:

networks:
  # Pinned explicitly, external, rather than left for Compose to derive.
  # Leaving this unnamed was tried first and broke: something about how
  # Dokploy invokes `docker compose` here made the implicit default network
  # resolve to this file's own top-level `name: vestigian` (line 1) instead of
  # Dokploy's actual project-scoped name — not the normal
  # `${COMPOSE_PROJECT_NAME}_default` behavior, and not worth chasing further.
  # `docker network ls` on the VPS confirmed the network the already-running
  # services (postgres, valkey, etc.) actually sit on is this exact name.
  #
  # Fragility this trades in: that name embeds Dokploy's own app-instance id
  # (the `-4vgm6i` suffix), so a fresh deploy into a *new* Dokploy application
  # would need this updated to match — check `docker network ls` on the VPS
  # for the real name if this ever needs to move.
  #test
  default:
    name: vestigian-4vgm6i_default
    external: true
  # Pre-existing network Dokploy's own Traefik instance runs on. External
  # because this compose project doesn't own it — only `app` and `imgproxy`
  # join it, since those are the only two services Traefik actually routes to.
  dokploy-network:
    external: true
